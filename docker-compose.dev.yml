# Optional dev override — exposes postgres/redis/qdrant on non-colliding host ports.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Do NOT merge this into docker-compose.yml; the default must stay private.
services:
  postgres:
    ports:
      - "127.0.0.1:${SCRIBE_POSTGRES_PORT:-55432}:5432"
  redis:
    ports:
      - "127.0.0.1:${SCRIBE_REDIS_PORT:-6479}:6379"
  qdrant:
    ports:
      - "127.0.0.1:${SCRIBE_QDRANT_HTTP_PORT:-6433}:6333"
      - "127.0.0.1:${SCRIBE_QDRANT_GRPC_PORT:-6434}:6334"
